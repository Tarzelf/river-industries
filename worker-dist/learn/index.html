<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Learn more — River Industries</title>
  <meta name="description" content="Quiet industrial systems for multi-planetary construction. Coming soon." />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root {
      --void: #050505;
      --ink: #f4f4f2;
      --ink-dim: rgba(244,244,242,0.5);
      --ink-mid: rgba(244,244,242,0.72);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--void);
      color: var(--ink);
      font-family: Inter, "Helvetica Neue", ui-sans-serif, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100svh;
      min-height: 100dvh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
      background: rgba(5,5,5,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(244,244,242,0.06);
    }
    .logo {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    .back {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-dim);
      text-decoration: none;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 8px 4px;
      white-space: nowrap;
    }
    .back:active { color: var(--ink); }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px max(20px, env(safe-area-inset-right)) 64px max(20px, env(safe-area-inset-left));
    }
    h1 {
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 500;
      letter-spacing: -0.03em;
      text-align: center;
      margin-bottom: 14px;
      line-height: 1.1;
    }
    .sub {
      font-size: 15px;
      color: var(--ink-mid);
      text-align: center;
      max-width: 380px;
      line-height: 1.55;
      margin-bottom: 36px;
      padding: 0 4px;
    }
    .form-wrap {
      width: 100%;
      max-width: 420px;
      margin-bottom: 56px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    @media (min-width: 520px) {
      form { flex-direction: row; gap: 8px; }
    }
    input[type="email"] {
      flex: 1;
      width: 100%;
      background: rgba(244,244,242,0.03);
      border: 1px solid rgba(244,244,242,0.16);
      border-radius: 999px;
      padding: 16px 20px;
      font-size: 16px; /* prevents iOS zoom */
      color: var(--ink);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.25s var(--ease);
    }
    input[type="email"]::placeholder { color: var(--ink-dim); }
    input[type="email"]:focus { border-color: rgba(244,244,242,0.45); }
    button {
      width: 100%;
      background: var(--ink);
      color: var(--void);
      border: none;
      border-radius: 999px;
      padding: 16px 24px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      min-height: 52px;
      -webkit-appearance: none;
      appearance: none;
      transition: opacity 0.25s var(--ease);
    }
    @media (min-width: 520px) {
      button { width: auto; white-space: nowrap; }
    }
    button:active { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: default; }
    .note {
      font-size: 13px;
      color: var(--ink-dim);
      text-align: center;
      margin-top: 14px;
      min-height: 1.2em;
    }
    .systems {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 640px) {
      .systems { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    }
    .system {
      position: relative;
      aspect-ratio: 16 / 10;
      background: #0a0a0a;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(244,244,242,0.08);
    }
    .system video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-dim);
      background: rgba(5,5,5,0.65);
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    footer {
      padding: 20px max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">River Industries</a>
    <a class="back" href="/">← Home</a>
  </header>
  <main>
    <h1>Coming soon</h1>
    <p class="sub">Quiet industrial systems for multi-planetary construction. Leave your email to get updates.</p>
    <div class="form-wrap">
      <form id="signup" action="#" method="post">
        <input type="email" name="email" placeholder="you@company.com" required autocomplete="email" inputmode="email" enterkeyhint="send" />
        <button type="submit">Notify me</button>
      </form>
      <p class="note" id="msg"></p>
    </div>
    <div class="systems">
      <div class="system">
        <video src="/holo-paint.mp4" autoplay muted loop playsinline webkit-playsinline preload="metadata"></video>
        <span class="label">Paint</span>
      </div>
      <div class="system">
        <video src="/holo-frame.mp4" autoplay muted loop playsinline webkit-playsinline preload="metadata"></video>
        <span class="label">Frame</span>
      </div>
      <div class="system">
        <video src="/holo-floor.mp4" autoplay muted loop playsinline webkit-playsinline preload="metadata"></video>
        <span class="label">Floor</span>
      </div>
    </div>
  </main>
  <footer>hello@river.industries · United States</footer>
  <script>
    document.getElementById('signup').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = this.email.value.trim();
      if (!email) return;
      this.querySelector('button').disabled = true;
      document.getElementById('msg').textContent = 'Thanks — we will be in touch.';
      this.reset();
      var btn = this.querySelector('button');
      setTimeout(function () { btn.disabled = false; }, 2000);
    });
  </script>
</body>
</html>
