<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>River Industries</title>
  <meta name="description" content="River Industries. Quiet industrial systems for multi-planetary construction." />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="canonical" href="https://river.industries/" />
  <link rel="preload" as="image" href="/hero-poster.jpg" />
  <style>
    :root {
      --void: #050505;
      --ink: #f4f4f2;
      --ink-dim: rgba(244,244,242,0.5);
      --ink-mid: rgba(244,244,242,0.72);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      height: 100dvh;
      background: var(--void);
      color: var(--ink);
      font-family: Inter, "Helvetica Neue", ui-sans-serif, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      overscroll-behavior: none;
    }
    .hero {
      position: fixed;
      inset: 0;
      background: var(--void);
      display: grid;
      place-items: center;
    }
    .hero video,
    .hero .poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background: var(--void);
    }
    /* Mobile: keep full composition visible instead of heavy crop */
    @media (max-width: 900px) and (orientation: portrait) {
      .hero video,
      .hero .poster {
        object-fit: contain;
        object-position: center 42%;
        width: 100%;
        height: 100%;
        padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
      }
    }
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(5,5,5,0.55) 0%, transparent 18%, transparent 78%, rgba(5,5,5,0.7) 100%),
        radial-gradient(ellipse at center, transparent 45%, rgba(5,5,5,0.25) 100%);
    }
    .nav {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 20;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 12px 12px;
    }
    .nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 48px;
      padding: 12px 18px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-dim);
      text-decoration: none;
      border-radius: 999px;
      background: rgba(5,5,5,0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(244,244,242,0.08);
      transition: color 0.25s var(--ease), background 0.25s var(--ease);
    }
    .nav a:active,
    .nav a:hover { color: var(--ink); background: rgba(5,5,5,0.55); }
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      padding: 12px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      pointer-events: none;
    }
    .footer a {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 10px 14px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
      text-decoration: none;
      transition: color 0.25s var(--ease);
    }
    .footer a:hover,
    .footer a:active { color: var(--ink); }
    @media (min-width: 768px) {
      .nav a { font-size: 11px; letter-spacing: 0.22em; background: transparent; border: none; backdrop-filter: none; }
      .footer a { font-size: 11px; letter-spacing: 0.22em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero video { display: none; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <img class="poster" src="/hero-poster.jpg" alt="" aria-hidden="true" />
    <video
      id="hero"
      src="/hero.mp4"
      poster="/hero-poster.jpg"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    ></video>
    <div class="overlay"></div>
  </div>
  <nav class="nav">
    <a href="/learn/">Learn more</a>
  </nav>
  <div class="footer">
    <a href="mailto:hello@river.industries">hello@river.industries</a>
  </div>
  <script>
    (function () {
      var v = document.getElementById('hero');
      if (!v) return;
      v.muted = true;
      v.setAttribute('playsinline', '');
      var tryPlay = function () {
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      };
      tryPlay();
      document.addEventListener('touchstart', tryPlay, { once: true, passive: true });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) tryPlay();
      });
    })();
  </script>
</body>
</html>
