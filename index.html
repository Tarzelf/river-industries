<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>River Industries</title>
  <meta name="description" content="River Industries. Quiet industrial systems for multi-planetary construction." />
  <meta name="theme-color" content="#050505" />
  <link rel="canonical" href="https://river.industries/" />
  <style>
    :root {
      --void: #050505;
      --ink: #f4f4f2;
      --ink-dim: rgba(244,244,242,0.45);
      --ink-mid: rgba(244,244,242,0.7);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--void);
      color: var(--ink);
      font-family: Inter, "Helvetica Neue", Arial, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .hero {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--void);
    }
    .hero video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--void);
    }
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(5,5,5,0.35) 100%);
    }
    .nav {
      position: fixed;
      top: max(20px, env(safe-area-inset-top));
      right: max(20px, env(safe-area-inset-right));
      z-index: 10;
    }
    .nav a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
      text-decoration: none;
      transition: color 0.25s var(--ease);
    }
    .nav a:hover { color: var(--ink); }
    .footer {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
    .footer a {
      pointer-events: auto;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
      text-decoration: none;
      transition: color 0.25s var(--ease);
    }
    .footer a:hover { color: var(--ink); }
    @media (prefers-reduced-motion: reduce) {
      .hero video { display: none; }
      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: #050505 url('/hero-poster.jpg') center/cover no-repeat;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <video src="/hero.mp4" autoplay muted loop playsinline preload="auto" poster=""></video>
    <div class="overlay"></div>
  </div>
  <nav class="nav">
    <a href="/learn/">Learn more</a>
  </nav>
  <div class="footer">
    <a href="mailto:hello@river.industries">hello@river.industries</a>
  </div>
</body>
</html>
